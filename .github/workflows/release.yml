name: Release

on:
  push:
    branches: master

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

    - name: Checkout
      uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

    - name: Setup Node.js
      uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
      with:
        node-version-file: '.nvmrc'

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8.15.9
        run_install: true

    - name: Type check
      run: pnpm type-check

    - name: Test
      run: pnpm test

    - name: Release
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: pnpm dlx semantic-release
